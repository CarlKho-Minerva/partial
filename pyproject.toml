[project]
name = "partial"
version = "0.1.0"
description = "Reconstruct a damaged biosignal recording session from its raw serial tape, with every claim marked observed or inferred"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "openai>=1.40", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
partial = "partial.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
